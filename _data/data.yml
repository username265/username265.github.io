projects:
  title: Engineering Projects

  assignments:
    - title: "Development of a Multi-Sensor-Based Glass-Breaking Drone<br>"
      tagline: >-
        Developed a multi-sensor-based glass-breaking drone to support firefighting operations in high-rise buildings.
        Implemented an environmental sensing system using thermal imaging and distance sensors, and improved flight stability by integrating Optical Flow and LiDAR sensors.
        Designed a glass-breaking mechanism inspired by the striking motion of mantis shrimp.
        As team leader, coordinated system integration and performance testing, and received an Excellence Award at the 2026 Advanced Mobility Global Contest.


    - title: "FFT-Based Analysis and FIR Filtering of Ultrasound RF Signals<br>"
      tagline: >-
        Analyzed ultrasound RF data using MATLAB and improved image quality through digital filtering.
        Performed FFT-based frequency analysis and designed a 50th-order FIR bandpass filter and a 100th-order FIR bandstop filter.
        Applied the filters to individual RF channels and reconstructed ultrasound images using envelope detection and log compression to evaluate noise reduction performance.


    - title: "Infrared Thermal Data Processing and Visualization<br>"
      tagline: >-
        Developed a thermal data acquisition system using an MLX90640 infrared thermal sensor and an STM32 microcontroller, transmitting temperature measurements to a PC along with frame IDs and timestamps.
        Used Python to store the collected data in CSV files and visualize temperature distributions as heatmaps.
        Analyzed temperature statistics and heat source locations to compare thermal characteristics under different measurement conditions.




