projects:
  title: Engineering Projects
  intro: >-
    Selected academic and team projects involving embedded systems,
    digital signal processing, power system design, and electronic circuits.

  assignments:
    - title: "Multi-Sensor Fire-Response Drone System"
      tagline: >-
        Team Leader | Excellence Award (우수상), Advanced Mobility Global
        Contest 2026. Led the development of a drone-based prototype
        integrating Pixhawk, ESP32/STM32 microcontrollers, thermal and distance
        sensors. Worked on sensor control, hardware integration, and
        Python-based thermal data analysis.

    # Temporary DSP entry: replace with the future image-analysis project.
    - title: "Convolution in MATLAB: From Theory to Implementation"
      tagline: >-
        Explored signal convolution through MATLAB-based implementation
        and visualization, connecting signal-processing theory with
        computational analysis.

    - title: "Power System Capacity and Cost Design"
      tagline: >-
        Developed an academic power-system design for an 840 MVA base load
        with a 10% reserve margin. Compared generator, transformer, and
        transmission-line configurations and proposed a 950 MVA generation
        plan exceeding the 924 MVA capacity requirement.

    - title: "Analog Circuit Characterization and Simulation"
      tagline: >-
        Investigated 2N7000 MOSFET current-voltage characteristics and
        uA741 operational-amplifier circuits, including inverting amplifiers
        and voltage followers. Used PSpice simulations and laboratory
        measurements to compare theoretical and experimental behavior.

