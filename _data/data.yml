career-profile:
  title: About Me
  summary: |
    I am an undergraduate student majoring in Electrical and Electronic
    Engineering at Dankook University.

    My interests include embedded systems, digital signal processing,
    electronic circuits, and hardware-software integration. Through academic
    projects and hands-on engineering experience, I have developed practical
    skills in microcontroller programming, sensor interfacing, circuit
    analysis, and system design.

    I am interested in applying engineering principles to develop reliable
    and practical technology.

